---
classes:
  - 'profile::apache'

profile::apache::vhosts:

############################################### START VHOST ####################################################

  'test.burgerbib.ch':
    ip: 91.92.154.92
    port: 80
    servername: 'test.burgerbib.ch'
    serveraliases:
      - 'www.test.burgerbib.ch'
    logroot: /var/log/httpd
    error_log: true
    error_log_file: test.burgerbib.ch-http-error.log
    access_log: true
    access_log_file: test.burgerbib.ch-http-access.log
    redirect_status: 'permanent'
    redirect_dest: 'https://test.burgerbib.ch/'
    docroot: false
    priority: false

  'test.burgerbib.ch-ssl':
    ip: 91.92.154.92
    port: 443
    servername: 'test.burgerbib.ch'
    serveraliases:
      - 'www.test.burgerbib.ch'
    logroot: /var/log/httpd
    error_log: true
    error_log_file: test.burgerbib.ch-http-error.log
    access_log: true
    access_log_file: test.burgerbib.ch-http-access.log
    ssl: true
    ssl_cert: /etc/letsencrypt/live/test.burgerbib.ch/cert.pem
    ssl_key: /etc/letsencrypt/live/test.burgerbib.ch/privkey.pem
    ssl_chain: /etc/letsencrypt/live/test.burgerbib.ch/chain.pem
    ssl_protocol: all -SSLv3 -TLSv1 -TLSv1.1
    ssl_cipher: ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl_honorcipherorder: false
    ssl_stapling: true
    headers: [always set Strict-Transport-Security "max-age=63072000; includeSubDomains"]
    setenvif: [User-Agent ".*MSIE.*" nokeepalive ssl-unclean-shutdown downgrade-1.0 force-response-1.0]
    filters: [AddOutputFilterByType DEFLATE text/html text/xml text/plain, AddOutputFilterByType DEFLATE text/css, AddOutputFilterByType DEFLATE application/x-javascript application/javascript application/json]
    custom_fragment: |
        <Location />
            AuthType Digest
            AuthName "Login bgbern"
            AuthUserFile /etc/httpd/.htdigest.bgbern
            <RequireAny>
              Require ip 46.140.112.106
              Require ip 212.25.17.17
              Require ip 192.168.4.0/24
              Require ip 159.100.241.79
              Require valid-user
            </RequireAny>
        </Location>
        <Location /.well-known/acme-challenge/>
            Require all granted
        </Location>
    rewrites:
      - rewrite_rule: "^/.well-known/acme-challenge/(.*) /var/www/letsencrypt/.well-known/acme-challenge/$1 [L]"
      - comment: "Redirect urls from old site"
      - rewrite_rule: "^/(contact|@@contact|contact-info|@@contact-info)$ https://test.burgerbib.ch/de/generischer-kontaktformular-link [R=302,L]"
      - rewrite_cond: 
        - "%{literal('%')}{SERVER_NAME} !^test.burgerbib.ch$"
      - rewrite_rule: "^/(.*)$ http://test.burgerbib.ch/$1 [R=301,L]"
      - rewrite_rule: "^/(.*) http://127.0.0.1:10250/VirtualHostBase/https/%{literal('%')}{SERVER_NAME}:%{literal('%')}{SERVER_PORT}/burgerbib/platform/VirtualHostRoot/$1 [P,L]" 
    docroot: false
    priority: false

############################################### END VHOST ####################################################
